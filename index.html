<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08010f" />
<title>お前の年齢は？</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Kosugi+Maru&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:"Kosugi Maru",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#1a0040,#08010f);touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100dvh;padding:12px;gap:10px;max-width:480px;margin:0 auto;align-items:center}
.title{font-family:"Mochiy Pop P One",sans-serif;font-size:22px;color:#ffe066;-webkit-text-stroke:2.5px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #ff5fa2;margin:6px 0;text-align:center;transform:rotate(-2deg)}
.cam-wrap{flex:1;width:100%;max-width:380px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;position:relative;background:#000;border:4px solid #ffe066;box-shadow:0 0 20px rgba(255,224,102,.4)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(255,224,102,.3) 50%,transparent);transform:translateY(-100%);pointer-events:none}
.scan.go{animation:scan 1.6s linear}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.result{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.85);padding:14px;text-align:center;display:none}
.result.show{display:block}
.result .age{font-family:"Mochiy Pop P One",sans-serif;font-size:48px;color:#ffe066;line-height:1}
.result .age small{font-size:18px;opacity:.9}
.result .cmt{font-size:13px;margin-top:6px;line-height:1.5}
.actions{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.actions button{background:#ffe066;color:#000;border:3px solid #000;padding:12px 22px;font-family:"Mochiy Pop P One",sans-serif;font-size:14px;border-radius:999px;cursor:pointer;box-shadow:3px 3px 0 #000}
.actions .share{background:#1da1f2;color:#fff}
.actions button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.actions button:disabled{opacity:.4}
.note{font-size:9px;opacity:.65;text-align:center;line-height:1.5}
.err{padding:14px;background:rgba(255,0,0,.2);border:2px solid #f55;border-radius:10px;font-size:13px;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div id="app">
<h1 class="title">お前の年齢は？</h1>
<div class="cam-wrap">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="cv"></canvas>
  <div class="scan" id="scan"></div>
  <div class="result" id="result">
    <div class="age"><span id="age">??</span><small>歳</small></div>
    <div class="cmt" id="cmt">—</div>
  </div>
</div>
<div class="actions">
  <button id="btn-start">📷 カメラ起動</button>
  <button id="btn-shoot" disabled>🔍 診断する</button>
  <button id="btn-share" class="share" disabled>🔗 シェア</button>
</div>
<div class="note">※ネタ用フェイク診断。実年齢じゃないよ<br/>画像は端末内処理のみ・送信なし</div>
<div class="err" id="err"></div>
</div>
<script>
(()=>{
'use strict';
const SHARE_URL='https://maxtakaharu34-cmd.github.io/age-jp/';
const COMMENTS=[
'若っ！うらやま','まだまだ青春やん','イケイケの年齢','働き盛り、頑張れ',
'落ち着きが出てきた頃','渋カッコいい','大ベテランの貫禄','永遠の若さ',
'ええ顔しとる','謎のオーラを感じる','人生まだまだこれから','心は10代やろ？'
];
const $=(id)=>document.getElementById(id);
const vid=$('vid'),cv=$('cv'),scan=$('scan'),result=$('result'),ageEl=$('age'),cmtEl=$('cmt'),err=$('err');
let stream=null,lastAge=null,lastCmt=null;
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:480,height:640},audio:false});
    vid.srcObject=stream;
    await vid.play();
    $('btn-shoot').disabled=false;
    $('btn-start').disabled=true;
    $('btn-start').textContent='✓ 起動済';
  }catch(e){
    err.textContent='カメラ起動失敗: '+e.message;err.classList.add('show');
  }
}
function diagnose(){
  if(!stream)return;
  const w=vid.videoWidth||320,h=vid.videoHeight||240;
  cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');
  ctx.drawImage(vid,0,0,w,h);
  // hash sample of pixels for fun deterministic age
  const data=ctx.getImageData(Math.floor(w*.3),Math.floor(h*.3),Math.floor(w*.4),Math.floor(h*.4)).data;
  let h1=0x811c9dc5;let bright=0;
  for(let i=0;i<data.length;i+=16){h1^=data[i];h1=Math.imul(h1,16777619)>>>0;bright+=(data[i]+data[i+1]+data[i+2])/3}
  bright/=(data.length/16);
  // map hash to 14-72
  const age=14+(h1%59);
  const cmt=COMMENTS[h1%COMMENTS.length];
  scan.classList.remove('go');void scan.offsetWidth;scan.classList.add('go');
  beep(440,.08);setTimeout(()=>beep(660,.08),200);setTimeout(()=>beep(880,.16),400);
  setTimeout(()=>{
    ageEl.textContent=age;cmtEl.textContent=cmt;result.classList.add('show');
    lastAge=age;lastCmt=cmt;$('btn-share').disabled=false;
    fanfare();
  },1500);
}
let ac=null;const en=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
const beep=(f,d,t='square',g=.1)=>{const a=en();const o=a.createOscillator();const gn=a.createGain();o.type=t;o.frequency.value=f;gn.gain.value=g;gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+d)};
const fanfare=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.15),i*100))};
$('btn-start').addEventListener('click',()=>{en();startCam()});
$('btn-shoot').addEventListener('click',()=>{en();diagnose()});
$('btn-share').addEventListener('click',()=>{
  if(lastAge==null)return;
  const txt=`AI診断したら【${lastAge}歳】って言われた！「${lastCmt}」 #お前の年齢は`;
  window.open(`https://x.com/intent/post?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(SHARE_URL)}`,'_blank','noopener,noreferrer');
});
})();
</script>
</body>
</html>
